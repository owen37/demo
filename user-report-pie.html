<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工单状态占比 - 报表管理系统</title>
  <style>
    :root {
      --ant-primary: #1677ff;
      --ant-primary-hover: #4096ff;
      --ant-primary-active: #0958d9;
      --ant-success: #52c41a;
      --ant-warning: #faad14;
      --ant-error: #ff4d4f;
      --ant-info-bg: #e6f4ff;
      --ant-success-bg: #f6ffed;
      --ant-warning-bg: #fffbe6;
      --ant-error-bg: #fff2f0;
      --ant-bg-layout: #f5f5f5;
      --ant-bg-container: #ffffff;
      --ant-bg-elevated: #ffffff;
      --ant-bg-subtle: #fafafa;
      --ant-border: #d9d9d9;
      --ant-border-subtle: #f0f0f0;
      --ant-text: #262626;
      --ant-text-secondary: #8c8c8c;
      --ant-text-disabled: #bfbfbf;
      --ant-radius: 6px;
      --ant-radius-lg: 8px;
      --ant-shadow-card: 0 1px 2px rgba(0, 0, 0, 0.03), 0 1px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px rgba(0, 0, 0, 0.02);
      --ant-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--ant-bg-layout);
      color: var(--ant-text);
      font-family: var(--ant-font);
      font-size: 14px;
      line-height: 1.5715;
      min-width: 1400px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      display: none !important;
      opacity: 0 !important;
      width: 0 !important;
      height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    input[type="date"]::-webkit-inner-spin-button,
    input[type="date"]::-webkit-outer-spin-button {
      -webkit-appearance: none !important;
      margin: 0 !important;
      display: none !important;
    }
    input[type="date"]::-moz-calendar-picker-indicator {
      display: none !important;
    }
    input[type="date"]::-ms-clear {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    input[type="date"]::-ms-expand {
      display: none !important;
    }
    input[type="date"]::-webkit-datetime-edit {
      padding: 0 !important;
    }
    input[type="date"]::-webkit-clear-button {
      display: none !important;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 156px minmax(0, 1fr);
    }

    .sidebar {
      background: #000;
      color: #fff;
      padding: 16px 0;
    }

    .sidebar-menu {
      padding: 8px 0;
    }

    .menu-item {
      padding: 12px 24px;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .menu-item.is-active {
      background: #1890ff;
      color: #fff;
    }

    .workspace {
      min-width: 0;
    }

    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 24px;
      background: var(--ant-bg-container);
      border-bottom: 1px solid var(--ant-border-subtle);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .breadcrumb {
      color: var(--ant-text-secondary);
    }

    .breadcrumb a {
      color: var(--ant-text-secondary);
      text-decoration: none;
    }

    .breadcrumb a:hover {
      color: var(--ant-primary);
    }

    .page-header,
    .filter-panel,
    .data-card,
    .form-card,
    .detail-card,
    .metric-card {
      background: var(--ant-bg-container);
      border-radius: var(--ant-radius-lg);
      box-shadow: var(--ant-shadow-card);
    }

    .page-header {
      margin: 24px 24px 16px;
      padding: 20px 24px;
    }

    .page-title {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .page-desc {
      margin: 8px 0 0;
      color: var(--ant-text-secondary);
    }

    .filter-panel,
    .data-card,
    .form-card,
    .detail-card {
      margin: 16px 24px;
      padding: 24px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-end;
    }

    .form-field {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ant-text);
      min-width: 200px;
    }
    .form-field span {
      white-space: nowrap;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      min-height: 32px;
      padding: 4px 11px;
      color: var(--ant-text);
      background: var(--ant-bg-container);
      border: 1px solid var(--ant-border);
      border-radius: var(--ant-radius);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input::placeholder,
    .textarea::placeholder {
      color: var(--ant-text-disabled);
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--ant-primary);
      box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.12);
    }

    .btn {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 4px 15px;
      border: 1px solid var(--ant-border);
      border-radius: var(--ant-radius);
      background: var(--ant-bg-container);
      color: var(--ant-text);
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .btn:hover {
      color: var(--ant-primary-hover);
      border-color: var(--ant-primary-hover);
    }

    .btn-primary {
      background: var(--ant-primary);
      border-color: var(--ant-primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--ant-primary-hover);
      border-color: var(--ant-primary-hover);
      color: #fff;
    }

    .pro-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--ant-bg-container);
    }

    .pro-table th,
    .pro-table td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--ant-border-subtle);
      text-align: left;
      vertical-align: middle;
    }

    .pro-table th {
      background: var(--ant-bg-subtle);
      color: var(--ant-text);
      font-weight: 600;
    }

    .pro-table tbody tr:hover {
      background: var(--ant-bg-subtle);
    }

    .chart-container {
      width: 100%;
      height: 400px;
      background: var(--ant-bg-subtle);
      border-radius: var(--ant-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      position: relative;
    }

    @media (max-width: 960px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .filter-row {
        flex-direction: column;
        align-items: stretch;
      }

      .form-field {
        min-width: 100%;
      }
    }

    @media (max-width: 640px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
        height: auto;
        padding-block: 16px;
      }

      .filter-panel,
      .data-card,
      .form-card,
      .detail-card,
      .page-header {
        margin-inline: 16px;
        padding: 16px;
      }

      .chart-container {
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <nav class="sidebar-menu">
        <a href="user-report-view.html" class="menu-item">上门工单趋势</a>
        <a href="user-report-line.html" class="menu-item">工单量趋势</a>
        <a href="user-report-bar.html" class="menu-item">服务类型分布</a>
        <a href="user-report-pie.html" class="menu-item is-active">工单状态占比</a>
        <a href="user-report-table.html" class="menu-item">工单明细</a>
      </nav>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <div class="breadcrumb">
            <a href="index.html">首页</a> / 工单状态占比
          </div>
        </div>
        <div class="topbar-right"></div>
      </header>

      <section class="filter-panel">
        <div class="filter-row">
          <label class="form-field">
            <span>创建时间</span>
            <div style="display: flex; gap: 8px; align-items: center; border: 1px solid var(--ant-border); border-radius: var(--ant-radius); padding: 4px 8px; background: var(--ant-bg-container);">
              <input class="input" type="date" value="2024-01-01" style="border: none; padding: 0; min-height: auto; background: transparent;">
              <span style="color: var(--ant-text-secondary);">至</span>
              <input class="input" type="date" value="2024-01-31" style="border: none; padding: 0; min-height: auto; background: transparent;">
            </div>
          </label>
          <label class="form-field">
            <span>工单状态</span>
            <select class="select">
              <option value="">全部</option>
              <option value="pending">待处理</option>
              <option value="completed">已完成</option>
              <option value="cancelled">已取消</option>
            </select>
          </label>
          <div style="display: flex; gap: 8px;">
            <button class="btn" type="button">重置</button>
            <button class="btn btn-primary" type="button">查询</button>
          </div>
        </div>
      </section>

      <section class="data-card">
        <div class="chart-container" style="padding: 20px;">
          <style>
            .pie-chart-container {
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 60px;
              height: 100%;
            }
            .pie-chart {
              position: relative;
              width: 280px;
              height: 280px;
            }
            .pie-slice {
              position: absolute;
              width: 100%;
              height: 100%;
              border-radius: 50%;
              clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 0%, 50% 0%);
            }
            .pie-legend {
              display: flex;
              flex-direction: column;
              gap: 16px;
            }
            .legend-item {
              display: flex;
              align-items: center;
              gap: 12px;
            }
            .legend-color {
              width: 16px;
              height: 16px;
              border-radius: 2px;
            }
            .legend-label {
              display: flex;
              flex-direction: column;
            }
            .legend-name {
              font-size: 14px;
              color: #262626;
            }
            .legend-value {
              font-size: 12px;
              color: #8c8c8c;
            }
          </style>
          <div class="pie-chart-container">
            <svg class="pie-chart" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="40" fill="none" stroke="#52c41a" stroke-width="20" stroke-dasharray="188.4 251.2" transform="rotate(-90 50 50)"></circle>
              <circle cx="50" cy="50" r="40" fill="none" stroke="#1677ff" stroke-width="20" stroke-dasharray="125.6 314" stroke-dashoffset="-188.4" transform="rotate(-90 50 50)"></circle>
              <circle cx="50" cy="50" r="40" fill="none" stroke="#faad14" stroke-width="20" stroke-dasharray="62.8 376.8" stroke-dashoffset="-314" transform="rotate(-90 50 50)"></circle>
              <circle cx="50" cy="50" r="40" fill="none" stroke="#ff4d4f" stroke-width="20" stroke-dasharray="37.68 401.92" stroke-dashoffset="-376.8" transform="rotate(-90 50 50)"></circle>
            </svg>
            <div class="pie-legend">
              <div class="legend-item">
                <div class="legend-color" style="background: #52c41a;"></div>
                <div class="legend-label">
                  <span class="legend-name">已完成</span>
                  <span class="legend-value">1880 (60%)</span>
                </div>
              </div>
              <div class="legend-item">
                <div class="legend-color" style="background: #1677ff;"></div>
                <div class="legend-label">
                  <span class="legend-name">待处理</span>
                  <span class="legend-value">628 (20%)</span>
                </div>
              </div>
              <div class="legend-item">
                <div class="legend-color" style="background: #faad14;"></div>
                <div class="legend-label">
                  <span class="legend-name">处理中</span>
                  <span class="legend-value">471 (15%)</span>
                </div>
              </div>
              <div class="legend-item">
                <div class="legend-color" style="background: #ff4d4f;"></div>
                <div class="legend-label">
                  <span class="legend-name">已取消</span>
                  <span class="legend-value">157 (5%)</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h3 style="margin: 0; font-size: 16px; font-weight: 600;">数据明细</h3>
          <button class="btn" type="button">导出</button>
        </div>
        <table class="pro-table">
          <thead>
            <tr>
              <th>工单状态</th>
              <th>工单数量</th>
              <th>占比</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>已完成</td>
              <td>1880</td>
              <td>60%</td>
            </tr>
            <tr>
              <td>待处理</td>
              <td>628</td>
              <td>20%</td>
            </tr>
            <tr>
              <td>处理中</td>
              <td>471</td>
              <td>15%</td>
            </tr>
            <tr>
              <td>已取消</td>
              <td>157</td>
              <td>5%</td>
            </tr>
          </tbody>
        </table>
      </section>
    </section>
  </main>
</body>
</html>

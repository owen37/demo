<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>报表展示 - 报表管理系统</title>
  <style>
    :root {
      --ant-primary: #1677ff;
      --ant-primary-hover: #4096ff;
      --ant-primary-active: #0958d9;
      --ant-success: #52c41a;
      --ant-warning: #faad14;
      --ant-error: #ff4d4f;
      --ant-info-bg: #e6f4ff;
      --ant-success-bg: #f6ffed;
      --ant-warning-bg: #fffbe6;
      --ant-error-bg: #fff2f0;
      --ant-bg-layout: #f5f5f5;
      --ant-bg-container: #ffffff;
      --ant-bg-elevated: #ffffff;
      --ant-bg-subtle: #fafafa;
      --ant-border: #d9d9d9;
      --ant-border-subtle: #f0f0f0;
      --ant-text: #262626;
      --ant-text-secondary: #8c8c8c;
      --ant-text-disabled: #bfbfbf;
      --ant-radius: 6px;
      --ant-radius-lg: 8px;
      --ant-shadow-card: 0 1px 2px rgba(0, 0, 0, 0.03), 0 1px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px rgba(0, 0, 0, 0.02);
      --ant-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--ant-bg-layout);
      color: var(--ant-text);
      font-family: var(--ant-font);
      font-size: 14px;
      line-height: 1.5715;
      min-width: 1400px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 156px minmax(0, 1fr);
    }

    .sidebar {
      background: #000;
      color: #fff;
      padding: 16px 0;
    }

    .sidebar-menu {
      padding: 8px 0;
    }

    .menu-item {
      padding: 12px 24px;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .menu-item-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .menu-arrow {
      transition: transform 0.2s;
      font-size: 10px;
    }

    .menu-parent.open .menu-arrow {
      transform: rotate(180deg);
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .menu-item.is-active {
      background: rgba(255, 255, 255, 0.15);
      color: #1890ff;
    }

    .workspace {
      min-width: 0;
    }

    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 24px;
      background: var(--ant-bg-container);
      border-bottom: 1px solid var(--ant-border-subtle);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .breadcrumb {
      color: var(--ant-text-secondary);
    }

    .breadcrumb a {
      color: var(--ant-text-secondary);
      text-decoration: none;
    }

    .breadcrumb a:hover {
      color: var(--ant-primary);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .page-header,
    .filter-panel,
    .data-card,
    .form-card,
    .detail-card,
    .metric-card {
      background: var(--ant-bg-container);
      border-radius: var(--ant-radius-lg);
      box-shadow: var(--ant-shadow-card);
    }

    .page-header {
      margin: 24px 24px 16px;
      padding: 20px 24px;
    }

    .page-title {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .page-desc {
      margin: 8px 0 0;
      color: var(--ant-text-secondary);
    }

    .filter-panel,
    .data-card,
    .form-card,
    .detail-card {
      margin: 16px 24px;
      padding: 24px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-end;
    }

    .form-field {
      display: grid;
      gap: 8px;
      color: var(--ant-text);
      min-width: 200px;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      min-height: 32px;
      padding: 4px 11px;
      color: var(--ant-text);
      background: var(--ant-bg-container);
      border: 1px solid var(--ant-border);
      border-radius: var(--ant-radius);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input::placeholder,
    .textarea::placeholder {
      color: var(--ant-text-disabled);
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--ant-primary);
      box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.12);
    }

    .btn {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 4px 15px;
      border: 1px solid var(--ant-border);
      border-radius: var(--ant-radius);
      background: var(--ant-bg-container);
      color: var(--ant-text);
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .btn:hover {
      color: var(--ant-primary-hover);
      border-color: var(--ant-primary-hover);
    }

    .btn-primary {
      background: var(--ant-primary);
      border-color: var(--ant-primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--ant-primary-hover);
      border-color: var(--ant-primary-hover);
      color: #fff;
    }

    .pro-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--ant-bg-container);
    }

    .pro-table th,
    .pro-table td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--ant-border-subtle);
      text-align: left;
      vertical-align: middle;
    }

    .pro-table th {
      background: var(--ant-bg-subtle);
      color: var(--ant-text);
      font-weight: 600;
    }

    .pro-table tbody tr:hover {
      background: var(--ant-bg-subtle);
    }

    .pagination {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
      align-items: center;
    }

    .pagination .btn {
      min-width: 32px;
      padding: 4px 8px;
    }

    .pagination .btn.is-active {
      background: var(--ant-primary);
      border-color: var(--ant-primary);
      color: #fff;
    }

    .chart-container {
      width: 100%;
      height: 400px;
      background: var(--ant-bg-subtle);
      border-radius: var(--ant-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      position: relative;
    }

    .chart-placeholder {
      text-align: center;
      color: var(--ant-text-secondary);
    }

    .chart-placeholder .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .report-tabs {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--ant-border-subtle);
      padding-bottom: 0;
    }

    .report-tab {
      padding: 12px 0;
      cursor: pointer;
      color: var(--ant-text-secondary);
      transition: color 0.2s;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .report-tab:hover {
      color: var(--ant-text);
    }

    .report-tab.is-active {
      color: var(--ant-primary);
      border-bottom-color: var(--ant-primary);
    }

    @media (max-width: 960px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .filter-row {
        flex-direction: column;
        align-items: stretch;
      }

      .form-field {
        min-width: 100%;
      }
    }

    @media (max-width: 640px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
        height: auto;
        padding-block: 16px;
      }

      .filter-panel,
      .data-card,
      .form-card,
      .detail-card,
      .page-header {
        margin-inline: 16px;
        padding: 16px;
      }

      .chart-container {
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <nav class="sidebar-menu">
        <div class="menu-item is-active">销售数据</div>
      </nav>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <div class="breadcrumb">
            <a href="index.html">首页</a> / 销售数据
          </div>
        </div>
        <div class="topbar-right"></div>
      </header>

      <!-- 查询筛选区域 -->
      <section class="filter-panel">
        <div class="filter-row">
          <label class="form-field">
            <span>创建时间 <span style="color: var(--ant-error);">*</span></span>
            <div style="display: flex; gap: 8px; align-items: center;">
              <input class="input" type="date" value="2024-01-01">
              <span>至</span>
              <input class="input" type="date" value="2024-01-31">
            </div>
          </label>
          <label class="form-field">
            <span>订单状态</span>
            <select class="select">
              <option value="">全部</option>
              <option value="pending">待处理</option>
              <option value="completed">已完成</option>
              <option value="cancelled">已取消</option>
            </select>
          </label>
          <div style="display: flex; gap: 8px;">
            <button class="btn" type="button">重置</button>
            <button class="btn btn-primary" type="button">查询</button>
          </div>
        </div>
      </section>

      <!-- 报表展示区域 - 图表+表格组合模式 -->
      <section class="data-card">
        <!-- 图表区域 -->
        <div class="chart-container">
          <svg width="100%" height="100%" viewBox="0 0 800 330" style="padding: 20px;">
            <!-- 坐标轴 -->
            <line x1="80" y1="300" x2="720" y2="300" stroke="#d9d9d9" stroke-width="1"/>
            <line x1="80" y1="40" x2="80" y2="300" stroke="#d9d9d9" stroke-width="1"/>
            
            <!-- Y轴刻度 -->
            <text x="70" y="60" text-anchor="end" font-size="12" fill="#8c8c8c">200</text>
            <line x1="75" y1="60" x2="80" y2="60" stroke="#d9d9d9" stroke-width="1"/>
            
            <text x="70" y="120" text-anchor="end" font-size="12" fill="#8c8c8c">150</text>
            <line x1="75" y1="120" x2="80" y2="120" stroke="#d9d9d9" stroke-width="1"/>
            
            <text x="70" y="180" text-anchor="end" font-size="12" fill="#8c8c8c">100</text>
            <line x1="75" y1="180" x2="80" y2="180" stroke="#d9d9d9" stroke-width="1"/>
            
            <text x="70" y="240" text-anchor="end" font-size="12" fill="#8c8c8c">50</text>
            <line x1="75" y1="240" x2="80" y2="240" stroke="#d9d9d9" stroke-width="1"/>
            
            <text x="70" y="300" text-anchor="end" font-size="12" fill="#8c8c8c">0</text>
            
            <!-- 网格线 -->
            <line x1="80" y1="60" x2="720" y2="60" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="80" y1="120" x2="720" y2="120" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="80" y1="180" x2="720" y2="180" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="80" y1="240" x2="720" y2="240" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="4,4"/>
            
            <!-- 数据：2024-01-01 -->
            <!-- 新建工单量 (125) -->
            <rect x="120" y="206.25" width="40" height="93.75" fill="#1677ff" rx="4"/>
            <text x="140" y="200" text-anchor="middle" font-size="12" fill="#262626">125</text>
            <!-- 完成工单量 (118) -->
            <rect x="170" y="210.6" width="40" height="89.4" fill="#52c41a" rx="4"/>
            <text x="190" y="204.35" text-anchor="middle" font-size="12" fill="#262626">118</text>
            <text x="155" y="320" text-anchor="middle" font-size="12" fill="#8c8c8c">01-01</text>
            
            <!-- 数据：2024-01-02 -->
            <!-- 新建工单量 (89) -->
            <rect x="240" y="228.85" width="40" height="71.15" fill="#1677ff" rx="4"/>
            <text x="260" y="222.6" text-anchor="middle" font-size="12" fill="#262626">89</text>
            <!-- 完成工单量 (86) -->
            <rect x="290" y="230.7" width="40" height="69.3" fill="#52c41a" rx="4"/>
            <text x="310" y="224.45" text-anchor="middle" font-size="12" fill="#262626">86</text>
            <text x="275" y="320" text-anchor="middle" font-size="12" fill="#8c8c8c">01-02</text>
            
            <!-- 数据：2024-01-03 -->
            <!-- 新建工单量 (152) -->
            <rect x="360" y="189.6" width="40" height="110.4" fill="#1677ff" rx="4"/>
            <text x="380" y="183.35" text-anchor="middle" font-size="12" fill="#262626">152</text>
            <!-- 完成工单量 (148) -->
            <rect x="410" y="192.08" width="40" height="107.92" fill="#52c41a" rx="4"/>
            <text x="430" y="185.83" text-anchor="middle" font-size="12" fill="#262626">148</text>
            <text x="395" y="320" text-anchor="middle" font-size="12" fill="#8c8c8c">01-03</text>
            
            <!-- 数据：2024-01-04 -->
            <!-- 新建工单量 (78) -->
            <rect x="480" y="235.68" width="40" height="64.32" fill="#1677ff" rx="4"/>
            <text x="500" y="229.43" text-anchor="middle" font-size="12" fill="#262626">78</text>
            <!-- 完成工单量 (75) -->
            <rect x="530" y="237.53" width="40" height="62.47" fill="#52c41a" rx="4"/>
            <text x="550" y="231.28" text-anchor="middle" font-size="12" fill="#262626">75</text>
            <text x="515" y="320" text-anchor="middle" font-size="12" fill="#8c8c8c">01-04</text>
            
            <!-- 数据：2024-01-05 -->
            <!-- 新建工单量 (198) -->
            <rect x="600" y="161.12" width="40" height="138.88" fill="#1677ff" rx="4"/>
            <text x="620" y="154.87" text-anchor="middle" font-size="12" fill="#262626">198</text>
            <!-- 完成工单量 (192) -->
            <rect x="650" y="164.83" width="40" height="135.17" fill="#52c41a" rx="4"/>
            <text x="670" y="158.58" text-anchor="middle" font-size="12" fill="#262626">192</text>
            <text x="635" y="320" text-anchor="middle" font-size="12" fill="#8c8c8c">01-05</text>
            
            <!-- 图例 -->
            <rect x="350" y="320" width="16" height="16" fill="#1677ff" rx="2"/>
            <text x="372" y="333" font-size="12" fill="#262626">新建工单量</text>
            
            <rect x="460" y="320" width="16" height="16" fill="#52c41a" rx="2"/>
            <text x="482" y="333" font-size="12" fill="#262626">完成工单量</text>
          </svg>
        </div>

        <!-- 表格区域 -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h3 style="margin: 0; font-size: 16px; font-weight: 600;">数据明细</h3>
          <button class="btn btn-primary" type="button">导出</button>
        </div>
        <table class="pro-table">
          <thead>
            <tr>
              <th>日期</th>
              <th>新建工单量</th>
              <th>完成工单量</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>2024-01-01</td>
              <td>125</td>
              <td>118</td>
            </tr>
            <tr>
              <td>2024-01-02</td>
              <td>89</td>
              <td>86</td>
            </tr>
            <tr>
              <td>2024-01-03</td>
              <td>152</td>
              <td>148</td>
            </tr>
            <tr>
              <td>2024-01-04</td>
              <td>78</td>
              <td>75</td>
            </tr>
            <tr>
              <td>2024-01-05</td>
              <td>198</td>
              <td>192</td>
            </tr>
          </tbody>
        </table>

        <div class="pagination">
          <span style="color: var(--ant-text-secondary); margin-right: 16px;">共 56 条记录</span>
          <button class="btn">&lt;</button>
          <button class="btn is-active">1</button>
          <button class="btn">2</button>
          <button class="btn">3</button>
          <button class="btn">4</button>
          <button class="btn">5</button>
          <button class="btn">&gt;</button>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
